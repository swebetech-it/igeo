# HTTP to HTTPS redirect (Port 80)
<VirtualHost *:80>
    ServerName dssengineercoltd.co.tz
    ServerAlias www.dssengineercoltd.co.tz

    # Redirect all HTTP requests to HTTPS (without www)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
    RewriteRule ^ https://dssengineercoltd.co.tz%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS Configuration (Port 443)
<VirtualHost *:443>
    ServerName dssengineercoltd.co.tz
    DocumentRoot /var/www/html/dss-web/public

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dssengineercoltd.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dssengineercoltd.co.tz/privkey.pem

    # Redirect www to non-www for HTTPS
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.dssengineercoltd\.co\.tz$ [NC]
    RewriteRule ^ https://dssengineercoltd.co.tz%{REQUEST_URI} [R=301,L]

    <Directory /var/www/html/dss-web>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/dss-web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # Handle Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # CRITICAL: Serve static files directly - this must come FIRST
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^(.*)$ $1 [L]

        # Redirect Trailing Slashes If Not A Folder
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Explicit MIME types for Vite assets
    <LocationMatch "\.css$">
        ForceType text/css
        Header set Content-Type "text/css"
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>

    <LocationMatch "\.js$">
        ForceType application/javascript
        Header set Content-Type "application/javascript"
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # CORS headers for assets
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$">
        Header set Access-Control-Allow-Origin "https://dssengineercoltd.co.tz"
        Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"
    </LocationMatch>

    # Optimize static assets
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public, immutable"
    </LocationMatch>

    # Error and Access Logs
    ErrorLog ${APACHE_LOG_DIR}/dssengineercoltd_error.log
    CustomLog ${APACHE_LOG_DIR}/dssengineercoltd_access.log combined
</VirtualHost>
