<VirtualHost *:80>
    ServerName brightstarsschools.co.tz
    ServerAlias www.brightstarsschools.co.tz
    DocumentRoot /var/www/html/brightstarschools.co.tz/public
    
    # Deny access to sensitive Laravel directories
    <Directory /var/www/html/brightstarschools.co.tz>
        Require all denied
    </Directory>
    
    # Allow access to public directory
    <Directory /var/www/html/brightstarschools.co.tz/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
        DirectoryIndex index.php
        
        # Laravel URL rewriting with Let's Encrypt exception
        RewriteEngine On
        # Allow Let's Encrypt challenges
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Specific access for .well-known directory
    <Directory /var/www/html/brightstarschools.co.tz/public/.well-known>
        AllowOverride None
        Options None
        Require all granted
        # Disable rewrite engine for this directory
        RewriteEngine Off
    </Directory>
    
    # Handle static files with caching
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    
    ErrorLog ${APACHE_LOG_DIR}/brightstarschools_error.log
    CustomLog ${APACHE_LOG_DIR}/brightstarschools_access.log combined
</VirtualHost>
