# HTTP VirtualHost - Temporary configuration before SSL
<VirtualHost *:80>
    ServerName greatautoworks.co.tz
    ServerAlias www.greatautoworks.co.tz
    DocumentRoot /var/www/html/greatautoworks/public
    
    <Directory /var/www/html/greatautoworks/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
        DirectoryIndex index.php
    </Directory>
    
    # Handle static files caching
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </LocationMatch>
    
    ErrorLog ${APACHE_LOG_DIR}/greatautoworks_error.log
    CustomLog ${APACHE_LOG_DIR}/greatautoworks_access.log combined
    
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.greatautoworks.co.tz [OR]
    RewriteCond %{SERVER_NAME} =greatautoworks.co.tz
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
