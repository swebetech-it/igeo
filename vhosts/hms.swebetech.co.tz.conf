# HTTP VirtualHost (Port 80) - Redirects to HTTPS
<VirtualHost *:80>
    ServerName hms.swebetech.co.tz
    ServerAlias *.hms.swebetech.co.tz
    DocumentRoot /var/www/html/hms/public

    # Enable rewrite engine for redirects
    RewriteEngine On

    # Redirect to non-www HTTPS
    RewriteRule ^(.*)$ https://hms.swebetech.co.tz$1 [R=301,L]

    # Basic security headers even for redirects
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    # Log configuration
    ErrorLog ${APACHE_LOG_DIR}/hms_http_error.log
    CustomLog ${APACHE_LOG_DIR}/hms_http_access.log combined
</VirtualHost>

# HTTPS VirtualHost (Port 443) - Main site configuration
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hms.swebetech.co.tz
    ServerAlias *.hms.swebetech.co.tz
    DocumentRoot /var/www/html/hms/public

    # Laravel + Livewire Configuration
    <Directory /var/www/html/hms/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Laravel URL Rewriting
        RewriteEngine On
        
        # Handle Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Standard Laravel front controller logic
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Enhanced Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "1; mode=block"

    # SSL Configuration (Using existing certificate paths)
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/hms.swebetech.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hms.swebetech.co.tz/privkey.pem

    # Optimized SSL settings
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Log configuration
    ErrorLog ${APACHE_LOG_DIR}/hms_error.log
    CustomLog ${APACHE_LOG_DIR}/hms_access.log combined
</VirtualHost>
</IfModule>
