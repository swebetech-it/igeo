<VirtualHost *:80>
    ServerName jgmengineering.co.tz
    ServerAlias www.jgmengineering.co.tz
    DocumentRoot /var/www/html/jgmengineering/public

    <Directory /var/www/html/jgmengineering>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/jgmengineering/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog /var/log/apache2/jgm_error.log
    CustomLog /var/log/apache2/jgm_access.log combined
    
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =jgmengineering.co.tz [OR]
    RewriteCond %{SERVER_NAME} =www.jgmengineering.co.tz
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
