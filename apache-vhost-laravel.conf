<VirtualHost *:80>
    ServerName dssengineercoltd.co.tz
    ServerAlias www.dssengineercoltd.co.tz
    DocumentRoot /var/www/html/dss-web/public

    <Directory /var/www/html/dss-web>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/dss-web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Laravel URL Rewriting
        RewriteEngine On

        # Handle Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Redirect Trailing Slashes If Not A Folder
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Send Requests To Front Controller
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Optimize static assets (CSS, JS, Images, Fonts)
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public, immutable"
    </LocationMatch>

    # Cache control for HTML files (shorter cache for dynamic content)
    <LocationMatch "\.html?$">
        ExpiresActive On
        ExpiresDefault "access plus 1 hour"
        Header append Cache-Control "public, must-revalidate"
    </LocationMatch>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Hide server information (ServerTokens should be in main config)
    # ServerTokens Prod  # Move this to /etc/apache2/conf-enabled/security.conf
    Header unset Server
    Header always unset X-Powered-By

    # Enable compression
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png|webp)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar|pdf)$ no-gzip dont-vary
        # Compress text, html, javascript, css, xml
        SetEnvIfNoCase Request_URI \
            \.(?:js|css|html|xml|txt|json)$ gzip
    </Location>

    # Prevent access to sensitive files
    <FilesMatch "\.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh)$">
        Require all denied
    </FilesMatch>

    # Prevent access to Laravel specific directories
    <DirectoryMatch "/\.(git|svn|hg)">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    # PHP Configuration for Laravel
    php_admin_value upload_max_filesize 64M
    php_admin_value post_max_size 64M
    php_admin_value max_execution_time 300
    php_admin_value max_input_vars 3000

    ErrorLog ${APACHE_LOG_DIR}/dss_error.log
    CustomLog ${APACHE_LOG_DIR}/dss_access.log combined
</VirtualHost>

# SSL Configuration (Recommended for production)
