# Simplified DSS Engineering Apache Configuration (Fixed for 500 errors)
# This configuration ensures both www and non-www work properly

# HTTP VirtualHost - Redirect to HTTPS
<VirtualHost *:80>
    ServerName dssengineercoltd.co.tz
    ServerAlias www.dssengineercoltd.co.tz

    # Simple redirect without complex rewrite rules
    Redirect permanent / https://dssengineercoltd.co.tz/

    ErrorLog ${APACHE_LOG_DIR}/dss_http_error.log
    CustomLog ${APACHE_LOG_DIR}/dss_http_access.log combined
</VirtualHost>

# HTTPS VirtualHost for www - Redirect to non-www
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.dssengineercoltd.co.tz

    # SSL Configuration (required for HTTPS redirect)
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dssengineercoltd.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dssengineercoltd.co.tz/privkey.pem

    # Simple redirect to non-www
    Redirect permanent / https://dssengineercoltd.co.tz/

    ErrorLog ${APACHE_LOG_DIR}/dss_www_error.log
    CustomLog ${APACHE_LOG_DIR}/dss_www_access.log combined
</VirtualHost>
</IfModule>

# Main HTTPS VirtualHost (non-www)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dssengineercoltd.co.tz
    DocumentRoot /var/www/html/dss-web/public

    # DSS Engineering Laravel Configuration
    <Directory /var/www/html/dss-web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Basic rewrite rules (let .htaccess handle Laravel routing)
        RewriteEngine On

        # Handle Authorization Header for Livewire
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    </Directory>

    # Storage directory configuration
    <Directory /var/www/html/dss-web/public/storage>
        Options +FollowSymLinks
        AllowOverride None
        Require all granted

        # Proper MIME types for images
        <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg)$">
            Header set Content-Type "image/jpeg" "expr=%{REQUEST_URI} =~ /\.jpe?g$/i"
            Header set Content-Type "image/png" "expr=%{REQUEST_URI} =~ /\.png$/i"
            Header set Content-Type "image/gif" "expr=%{REQUEST_URI} =~ /\.gif$/i"
            Header set Content-Type "image/webp" "expr=%{REQUEST_URI} =~ /\.webp$/i"
            Header set Content-Type "image/svg+xml" "expr=%{REQUEST_URI} =~ /\.svg$/i"
        </FilesMatch>
    </Directory>

    # Vite assets (simplified)
    <LocationMatch "build/assets/.*\.(css|js)$">
        Header set Content-Type "text/css" "expr=%{REQUEST_URI} =~ /\.css$/"
        Header set Content-Type "application/javascript" "expr=%{REQUEST_URI} =~ /\.js$/"
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>

    # Basic security headers
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Protect sensitive files
    <FilesMatch "\.(env|log|htaccess|htpasswd|ini)$">
        Require all denied
    </FilesMatch>

    # Laravel framework protection
    <DirectoryMatch "/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    # Custom error pages
    ErrorDocument 404 /index.php
    ErrorDocument 500 /index.php

    # SSL Configuration
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dssengineercoltd.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dssengineercoltd.co.tz/privkey.pem

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/dss_error.log
    CustomLog ${APACHE_LOG_DIR}/dss_access.log combined
</VirtualHost>
</IfModule>
