# HTTP to HTTPS redirect (Port 80)
<VirtualHost *:80>
    ServerName dssengineercoltd.co.tz
    ServerAlias www.dssengineercoltd.co.tz

    # Redirect all HTTP requests to HTTPS (without www)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
    RewriteRule ^ https://dssengineercoltd.co.tz%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS Configuration (Port 443)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dssengineercoltd.co.tz
    DocumentRoot /var/www/html/dss-web/public

    # Redirect www to non-www for HTTPS to prevent CORS issues
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.dssengineercoltd\.co\.tz$ [NC]
    RewriteRule ^ https://dssengineercoltd.co.tz%{REQUEST_URI} [R=301,L]

    # DSS Engineering Laravel + Livewire Configuration
    <Directory /var/www/html/dss-web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Laravel + Livewire URL Rewriting
        RewriteEngine On

        # Handle Livewire Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Handle Laravel CSRF Token Header
        RewriteCond %{HTTP:X-XSRF-TOKEN} .
        RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-TOKEN}]

        # CRITICAL: Serve existing files AND symbolic links directly
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -l
        RewriteRule ^ - [L]

        # Remove trailing slash for non-directories
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]

        # Laravel front controller for dynamic routes
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Explicit handling for DSS Engineering storage directory
    <Directory /var/www/html/dss-web/public/storage>
        Options +FollowSymLinks
        AllowOverride None
        Require all granted

        # Ensure proper MIME types for construction company files
        <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg)$">
            Header set Content-Type "image/jpeg" "expr=%{REQUEST_URI} =~ /\.jpe?g$/i"
            Header set Content-Type "image/png" "expr=%{REQUEST_URI} =~ /\.png$/i"
            Header set Content-Type "image/gif" "expr=%{REQUEST_URI} =~ /\.gif$/i"
            Header set Content-Type "image/webp" "expr=%{REQUEST_URI} =~ /\.webp$/i"
            Header set Content-Type "image/svg+xml" "expr=%{REQUEST_URI} =~ /\.svg$/i"
        </FilesMatch>
    </Directory>

    # Vite build assets optimization for DSS Engineering
    <LocationMatch "build/assets/.*\.(css|js)$">
        Header unset Content-Type
        Header set Content-Type "text/css" "expr=%{REQUEST_URI} =~ /\.css$/"
        Header set Content-Type "application/javascript" "expr=%{REQUEST_URI} =~ /\.js$/"
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public, max-age=2592000"

        # CORS headers for assets
        Header set Access-Control-Allow-Origin "https://dssengineercoltd.co.tz"
        Header set Access-Control-Allow-Methods "GET, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept"
    </LocationMatch>

    # Construction company media assets (gallery images, documents, logos)
    <LocationMatch "\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|pdf|doc|docx)$">
        ExpiresActive On
        ExpiresDefault "access plus 6 months"
        Header append Cache-Control "public, immutable, max-age=15552000"

        # CORS headers for media assets
        Header set Access-Control-Allow-Origin "https://dssengineercoltd.co.tz"
    </LocationMatch>

    # Security headers for DSS Engineering website
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set X-XSS-Protection "1; mode=block"

    # Compression for Laravel + Livewire performance
    <IfModule mod_deflate.c>
        <Location />
            SetOutputFilter DEFLATE
            SetEnvIfNoCase Request_URI \
                \.(?:gif|jpe?g|png|webp|ico|pdf|doc|docx|zip|rar)$ no-gzip dont-vary
            SetEnvIfNoCase Request_URI \
                \.(?:exe|t?gz|bz2|sit|rar)$ no-gzip dont-vary
        </Location>
    </IfModule>

    # Protect DSS Engineering Laravel application files
    <FilesMatch "\.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh|sql|backup)$">
        Require all denied
    </FilesMatch>

    # Protect Laravel framework directories
    <DirectoryMatch "/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)$">
        Require all denied
    </DirectoryMatch>

    # Protect version control and development files
    <DirectoryMatch "/\.(git|svn|hg|vscode|idea)">
        Require all denied
    </DirectoryMatch>

    # Protect sensitive construction company data
    <DirectoryMatch "/(backups?|dumps?|temp|tmp)">
        Require all denied
    </DirectoryMatch>

    # Custom error pages for DSS Engineering
    ErrorDocument 404 /index.php
    ErrorDocument 500 /index.php

    ErrorLog ${APACHE_LOG_DIR}/dss_error.log
    CustomLog ${APACHE_LOG_DIR}/dss_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dssengineercoltd.co.tz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dssengineercoltd.co.tz/privkey.pem
</VirtualHost>
</IfModule>
