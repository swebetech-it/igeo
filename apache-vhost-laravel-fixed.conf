

# SSL Configuration (Recommended for production)
<VirtualHost *:443>
    ServerName dssengineercoltd.co.tz
    ServerAlias www.dssengineercoltd.co.tz
    DocumentRoot /var/www/html/dss-web/public

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/dssengineercoltd.co.tz.crt
    SSLCertificateKeyFile /etc/ssl/private/dssengineercoltd.co.tz.key
    # SSLCertificateChainFile /etc/ssl/certs/intermediate.crt

    <Directory /var/www/html/dss-web>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/dss-web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # Handle Authorization Header
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # CRITICAL: Serve static files directly - this must come FIRST
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^(.*)$ $1 [L]

        # Redirect Trailing Slashes If Not A Folder
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Explicit MIME types for Vite assets
    <LocationMatch "\.css$">
        ForceType text/css
        Header set Content-Type "text/css"
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>

    <LocationMatch "\.js$">
        ForceType application/javascript
        Header set Content-Type "application/javascript"
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>

    # Other static assets
    <LocationMatch "\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$">
        ExpiresActive On
        ExpiresDefault "access plus 6 months"
        Header append Cache-Control "public, immutable"
    </LocationMatch>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Enable compression
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png|webp|ico)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar|pdf)$ no-gzip dont-vary
    </Location>

    # Prevent access to sensitive files
    <FilesMatch "\.(env|log|htaccess|htpasswd|ini|phps|fla|psd|sh)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/\.(git|svn|hg)">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/dss_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/dss_ssl_access.log combined
</VirtualHost>
